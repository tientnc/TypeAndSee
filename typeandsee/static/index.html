<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TypeAndSee</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#e8edf5;background:#0b1220}*{box-sizing:border-box}[hidden]{display:none!important}
    body{margin:0}.shell{max-width:1160px;margin:auto;padding:40px 24px}h1{font-size:clamp(2rem,5vw,3.5rem);margin:0 0 8px}
    p{color:#a7b4c8;line-height:1.5}.panel{background:#152238;border:1px solid #2a3c57;border-radius:18px;padding:20px;margin:24px 0}
    input,button{font:inherit}input[type=text],input[type=password]{background:#0b1220;color:#fff;border:1px solid #425676;border-radius:10px;padding:13px;width:100%}
    button{border:0;border-radius:10px;padding:13px 20px;background:#64d8c1;color:#08201b;font-weight:700;cursor:pointer}button:disabled{opacity:.5}
    .row{display:flex;gap:10px}.row input{flex:1}.small{font-size:.9rem;color:#91a3bc}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
    .card{background:#152238;border:1px solid #2a3c57;border-radius:14px;overflow:hidden}.card img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#23344d}
    .card .body{padding:12px}.card strong{display:block;overflow-wrap:anywhere}.score{color:#64d8c1}.error{color:#ffadad}.explanation{white-space:pre-wrap}
    label{display:block;margin:8px 0}.upload-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:600px){.row,.upload-grid{display:block}.row button{margin-top:10px}}
  </style>
</head>
<body><main class="shell">
  <h1>Find the moment.</h1><p>Search your images using natural language. Try "a red bicycle beside a café."</p>
  <section class="panel"><form id="searchForm"><div class="row"><input id="query" type="text" placeholder="Describe an image..." required maxlength="500"><button id="searchButton">Search</button></div><label class="small" id="explainLabel" hidden><input id="explain" type="checkbox"> Explain matches using stored captions and metadata</label></form></section>
  <details class="panel"><summary>Add images</summary><form id="uploadForm"><div class="upload-grid"><label>Images<input id="files" type="file" accept="image/jpeg,image/png,image/webp" multiple required></label><label>Caption<input id="caption" type="text" placeholder="Optional description"></label><label>Tags<input id="tags" type="text" placeholder="Optional tags"></label></div><label>Upload token (if configured)<input id="token" type="password" placeholder="Admin token"></label><p class="small">The token stays in this browser tab.</p><button>Upload and index</button><p id="uploadStatus" class="small"></p></form></details>
  <p id="status" aria-live="polite"></p><div id="explanation" class="panel explanation" hidden></div><div id="results" class="grid"></div>
</main><script>
const $=id=>document.getElementById(id);let urls=[];
const request=async(url,options={})=>{const r=await fetch(url,options);if(!r.ok){let msg;try{msg=(await r.json()).detail}catch{}throw new Error(msg||`HTTP ${r.status}`)}return r};
request('/api/config').then(r=>r.json()).then(config=>{$('explainLabel').hidden=!config.explanations_enabled}).catch(()=>{});
async function imageUrl(id){const r=await request(`/api/images/${id}`);return URL.createObjectURL(await r.blob())}
$('searchForm').addEventListener('submit',async e=>{e.preventDefault();$('searchButton').disabled=true;$('status').textContent='Searching...';$('status').className='';$('results').replaceChildren();$('explanation').hidden=true;urls.forEach(URL.revokeObjectURL);urls=[];
  try{const q=$('query').value.trim(),p=new URLSearchParams({q,explain_matches:$('explain').checked});const data=await(await request(`/api/search?${p}`)).json();$('status').textContent=`${data.results.length} results, ${Math.round(data.elapsed_ms)} ms, trace ${data.trace_id}`;
    if(data.explanation){$('explanation').textContent=data.explanation;$('explanation').hidden=false}
    for(const item of data.results){const card=document.createElement('article');card.className='card';const img=document.createElement('img');img.alt=item.caption||item.filename;img.loading='lazy';imageUrl(item.id).then(url=>{urls.push(url);img.src=url}).catch(()=>{img.alt='Image unavailable'});const body=document.createElement('div');body.className='body';const title=document.createElement('strong');title.textContent=item.filename;const desc=document.createElement('p');desc.textContent=item.caption||item.tags||'No caption';const score=document.createElement('span');score.className='score';score.textContent=`Similarity ${item.score.toFixed(3)}`;body.append(title,desc,score);card.append(img,body);$('results').append(card)}
  }catch(err){$('status').textContent=err.message;$('status').className='error'}finally{$('searchButton').disabled=false}});
$('uploadForm').addEventListener('submit',async e=>{e.preventDefault();const files=[...$('files').files];$('uploadStatus').textContent=`Indexing ${files.length} image(s)...`;
  let ok=0;for(const file of files){const body=new FormData();body.append('file',file);body.append('caption',$('caption').value);body.append('tags',$('tags').value);const headers=$('token').value?{Authorization:`Bearer ${$('token').value}`}:{ };try{await request('/api/images',{method:'POST',body,headers});ok++}catch(err){$('uploadStatus').textContent=`${ok}/${files.length} indexed. ${file.name}: ${err.message}`;return}}$('uploadStatus').textContent=`${ok} image(s) indexed.`});
</script></body></html>
